[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agqo"
dynamic = ["version"]
description = "AGQO: AI-guided quantum optimisation of whole-lot VN30 portfolios for small investors"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8", "requests>=2.31"]

[project.optional-dependencies]
quantum = ["qiskit>=2.5,<3"]
llm = ["modal>=1.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
hardware = ["qiskit>=2.5,<3", "qiskit-ibm-runtime>=0.50"]
studies = ["qiskit>=2.5,<3", "qiskit-ibm-runtime>=0.50", "qiskit-aer>=0.17.2"]
submission = ["python-docx>=1.1", "python-pptx>=1.0", "pymupdf>=1.24", "playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
agqo = "agqo.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "agqo.__version__"}

[tool.setuptools.packages.find]
include = ["agqo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
