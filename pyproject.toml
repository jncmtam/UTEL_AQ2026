[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agqo"
version = "3.0.0"
description = "AGQO: AI-guided quantum optimisation of whole-lot VN30 portfolios for small investors"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8", "requests>=2.31"]

[project.optional-dependencies]
quantum = ["qiskit>=1.2"]
llm = ["modal>=1.0"]
hardware = ["qiskit>=1.2", "qiskit-ibm-runtime>=0.30"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agqo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
