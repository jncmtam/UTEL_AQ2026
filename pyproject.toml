[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agqo-research"
version = "0.1.0"
description = "Bộ thử nghiệm AGQO: AI điều chỉnh rủi ro và QAOA chọn danh mục cổ phiếu."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.15,<2",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.11,<4",
]

[project.optional-dependencies]
qpu = ["qiskit>=2.3,<3", "qiskit-ibm-runtime>=0.47,<1"]
simulator = ["qiskit>=2.3,<3", "qiskit-aer>=0.17,<1"]
dev = ["pytest>=8.3,<10"]

[project.scripts]
agqo = "agqo.cli:main"

[tool.setuptools.packages.find]
include = ["agqo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
