[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agqo"
version = "2.0.0"
description = "AGQO: LLM-core market analysis and quantum-circuit design for VN30 integer-lot rebalancing"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8", "tabulate>=0.9"]

[project.optional-dependencies]
quantum = ["qiskit>=1.2"]
llm = ["modal>=1.0"]
hardware = ["qiskit>=1.2", "qiskit-ibm-runtime>=0.30"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["agqo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
