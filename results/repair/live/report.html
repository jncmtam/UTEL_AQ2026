<!doctype html><html lang='vi'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AGQO · Bằng chứng</title><style>body{font:16px/1.6 system-ui;max-width:1000px;margin:40px auto;padding:24px;background:#f6f4ed;color:#172d39}img{max-width:100%}figure{margin:35px 0}a{color:#246a65}</style><h1>AGQO · Bằng chứng nghiên cứu</h1><p>Benchmark có đối chứng; chưa xác lập ưu thế lượng tử hoặc tiết kiệm thực tế.</p><p><a href='summary.json'>Số liệu tổng hợp</a> · <a href='benchmark.json'>Kết quả đầy đủ</a> · <a href='protocol.json'>Giao thức</a></p><figure><img src='figures/01_tracking_turnover.png' alt='Hình 1. Đánh đổi tracking–turnover'><figcaption><b>Hình 1. Đánh đổi tracking–turnover.</b> Mỗi điểm là trung bình có điều kiện trên những nghiệm hợp lệ. Đọc cùng tỷ lệ khả thi ở Hình 2; đây không phải đường biên hiệu quả đã được chứng minh.</figcaption></figure><figure><img src='figures/02_feasibility.png' alt='Hình 2. Tỷ lệ phương án đáp ứng yêu cầu'><figcaption><b>Hình 2. Tỷ lệ phương án đáp ứng yêu cầu.</b> Tất cả giới hạn được kiểm tra bằng mô hình gốc. Case không có nghiệm vẫn xuất hiện trong mẫu; bộ giải báo infeasible không phải là lỗi.</figcaption></figure><figure><img src='figures/03_objective_gap.png' alt='Hình 3. Khoảng cách tới nghiệm tối ưu'><figcaption><b>Hình 3. Khoảng cách tới nghiệm tối ưu.</b> Khoảng cách tuyệt đối trên đúng cùng hàm mục tiêu; không chia cho giá trị tối ưu có thể gần 0. Phương án không hợp lệ được báo riêng.</figcaption></figure><figure><img src='figures/04_language_ablation.png' alt='Hình 4. Kiểm tra chuẩn hóa yêu cầu'><figcaption><b>Hình 4. Kiểm tra chuẩn hóa yêu cầu.</b> Bộ yêu cầu tự biên soạn có nhãn chuẩn độc lập gồm diễn đạt lại, mâu thuẫn, phủ định và thiếu thông tin; kết quả nhỏ mang tính chẩn đoán.</figcaption></figure><figure><img src='figures/05_cost_frontier.png' alt='Hình 5. Độ nhạy tracking–chi phí'><figcaption><b>Hình 5. Độ nhạy tracking–chi phí.</b> Nghiệm exact trên một fixture tổng hợp riêng, thay hệ số chi phí đã khai báo. Biểu đồ minh họa đánh đổi của mô hình, không dùng để chọn cấu hình từ tập test.</figcaption></figure><figure><img src='figures/06_quality_resources.png' alt='Hình 6. Chất lượng và tài nguyên'><figcaption><b>Hình 6. Chất lượng và tài nguyên.</b> Thời gian gồm dựng oracle và tối ưu; nhánh LLM tính thêm latency chọn mạch. Điểm trung bình có điều kiện không thay thế phân tích thất bại hay chứng minh speedup.</figcaption></figure><figure><img src='figures/07_unseen_structure.png' alt='Hình 7. Khả năng thích nghi theo nhóm yêu cầu'><figcaption><b>Hình 7. Khả năng thích nghi theo nhóm yêu cầu.</b> Nhóm unseen là tổ hợp giới hạn không dùng để chọn cấu hình cố định. Nhóm không có nghiệm được giữ lại để kiểm tra phản hồi; không kỳ vọng tỷ lệ khả thi dương.</figcaption></figure></html>
