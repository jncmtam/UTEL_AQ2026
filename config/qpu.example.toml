[ibm]
# Chỉ điền sau khi nhóm có tài khoản/dịch vụ và đã chọn thiết bị phù hợp.
channel = "FILL_IN"
instance = "FILL_IN"
backend = "FILL_IN_FROM_PROVIDER"
# Đặt giá trị tên biến môi trường, không đặt khóa bí mật trực tiếp ở đây.
token_env = "IBM_QUANTUM_TOKEN"
shots = 512
max_evaluations = 50
max_shots = 800000
allow_simulator = false
ledger_path = "outputs/qpu_shot_ledger.json"
