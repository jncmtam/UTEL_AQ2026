      - "ESP là mô hình ước tính từ số cổng và tỷ lệ lỗi. Không phải chạy phần cứng."
      - "Mô phỏng nhiễu Aer chạy cho 3 quý: 4,2% · 0,7% · 18,5%."
      - "Ở 3 quý đó, số cổng hai qubit sau biên dịch là 2–34, trung bình 16."
      - "Deep circuit đầy đủ (1.440 cổng logic, ~4.355 cổng thực) gần như mất hết tín hiệu dưới nhiễu hiện nay."
    caption: "IBM Heron (FakeKingston), schedule chọn trên dữ liệu 2023. Nguồn: results/final/extras/hardware_aware.csv, hardware.csv."
