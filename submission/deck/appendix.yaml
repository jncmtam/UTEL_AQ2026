# Appendix slides (Vietnamese text; figure labels English). kind: table | chart | text.
items:
  - id: A1
    kind: text
    headline: "A1 · Bài toán lô chẵn thành QUBO 16 qubit"
    size: 17
    lines:
      - "Số cổ phiếu mã j = phần cố định + 100 × x_k, với x_k ∈ {0, 1} cho 16 mã khó làm tròn nhất (giá trị lô × khoảng cách tới số nguyên)."
      - "Tỷ trọng là hàm tuyến tính của bit: w = w₀ + A·x."
      - "Mục tiêu: E(x) = 252·(wᵀΣw − 2wᵀc + σ_b²) + γ‖w − w_cũ‖² + λ(1ᵀw − t)², Σ, c ước tính từ 250 phiên trước ngày quyết định, covariance shrinkage 5% về đường chéo."
      - "Vì mọi số hạng bậc hai theo w và w tuyến tính theo x, QUBO chính là mục tiêu rời rạc thật. Không phải xấp xỉ."
      - "Ràng buộc (tiền mặt ≥ 0 sau phí, trần ngành, trần mỗi mã, tiền mặt tối thiểu) kiểm tra chính xác trên NAV sau phí cho từng tổ hợp. Khi dựng bài toán, mỗi trần được siết theo biên phí để mọi trạng thái của register vẫn thỏa."
      - "Mạch: Warm start R_y theo continuous relaxation (Egger và cộng sự 2021), aligned mixer, coupling-mass pruning (giữ các cặp ZZ mạnh nhất), RMS scaling (Sureshbabu và cộng sự 2024), linear-ramp schedule (Montañez-Barrera & Michielsen 2025)."
    caption: "Chi tiết: docs/METHODS.md, agqo/portfolio.py, agqo/quantum/design.py."
  - id: A1a
    kind: image
    headline: "A1a · Kiến trúc: Mỗi thành phần làm đúng việc nó giỏi và bị kiểm tra chéo"
    image: submission/report/figures_en/f3_pipeline.png
    width: 9.6
    side:
      - "LLM chỉ đọc ngôn ngữ, không tạo con số."
      - "k-NN chọn schedule theo 10 bài toán 2023 giống nhất."
      - "QAOA đề xuất 512 mẫu, không tự quyết."
      - "Exhaustive enumeration là trọng tài cuối cùng."
    caption: "Hình vẽ: submission/report/figures_en.py (pipeline)."
  - id: A1b
    kind: image
    headline: "A1b · Mạch AGQO theo ký hiệu chuẩn: Warm start, cost layer, aligned mixer"
    image: submission/report/figures_en/f5_circuit.png
    width: 12.2
    caption: "4/16 qubit. R_Y(θ_k): Warm start từ continuous relaxation. R_ZZ(2γJ_ij), R_Z(2γh_k): Cost layer. U_M(β) = R_Y(θ_k)R_Z(−2β)R_Y(−θ_k): Aligned mixer. Phải: Góc sau COBYLA polish, nét đứt là linear-ramp khởi tạo (quý 10/2026)."
  - id: A2
    kind: table
    headline: "A2 · Bốn đại lượng khác nhau, đừng trộn lẫn"
    rows:
      - ["Đại lượng", "Đo cái gì", "Giá trị trong nghiên cứu"]
      - ["Xác suất near-optimal mỗi shot", "Chất lượng mẫu: P(đủ tiền, thỏa quy tắc, normalized gap ≤ 5%)", "AGQO 21,3% · warm start 3,1% · textbook QAOA 1,1%"]
      - ["Số shots", "Bao nhiêu mẫu lấy từ một mạch đã chạy", "512 mỗi quyết định. Với 21% mỗi lần, gần như chắc chắn có ít nhất một mẫu near-optimal"]
      - ["Số lần mô phỏng mạch", "Chi phí của bộ tối ưu góc", "Frozen schedule: 1 · COBYLA polish: 41 · textbook QAOA: 101"]
      - ["Cổng hai qubit", "Độ sâu / chi phí phần cứng", "AGQO 1.440 cổng logic (p = 6). Mạch chọn cho nhiễu: 4–20 logic, 2–34 sau biên dịch"]
      - ["Normalized gap", "(Mục tiêu − tối ưu) / (trung vị khả thi − tối ưu)", "0 = tối ưu chính xác trong không gian đã mã hoá. 1 = lựa chọn khả thi điển hình"]
    caption: "Nguồn: results/final/quantum_test.csv, quantum_stats.json, extras/hardware_aware.csv."
  - id: A3
