# Appendix slides (Vietnamese text; figure labels English). kind: table | chart | text.
items:
  - id: A1
    kind: text
    headline: "A1 · Bài toán lô chẵn thành QUBO 16 qubit"
    size: 17
    lines:
      - "Số cổ phiếu mã j = phần cố định + 100 × x_k, với x_k ∈ {0, 1} cho 16 mã khó làm tròn nhất (giá trị lô × khoảng cách tới số nguyên)."
      - "Tỷ trọng là hàm tuyến tính của bit: w = w₀ + A·x."
      - "Mục tiêu: E(x) = 252·(wᵀΣw − 2wᵀc + σ_b²) + γ‖w − w_cũ‖² + λ(1ᵀw − t)², Σ, c ước tính từ 250 phiên trước ngày quyết định, co về đường chéo 5%."
      - "Vì mọi số hạng bậc hai theo w và w tuyến tính theo x, QUBO chính là mục tiêu rời rạc thật; không phải xấp xỉ."
      - "Ràng buộc (tiền mặt ≥ 0 sau phí, trần ngành, trần mỗi mã, tiền mặt tối thiểu) kiểm tra chính xác trên NAV sau phí cho từng tổ hợp; khi dựng bài toán, mỗi trần được siết theo biên phí để mọi trạng thái của thanh ghi vẫn thỏa."
      - "Mạch: khởi động ấm R_y theo nghiệm nới lỏng (Egger và cộng sự 2021), bộ trộn căn chỉnh, giữ các cặp ZZ mạnh nhất, chuẩn hoá RMS (Sureshbabu và cộng sự 2024), lịch góc dốc tuyến tính (Montañez-Barrera & Michielsen 2025)."
    caption: "Chi tiết: docs/METHODS.md, agqo/portfolio.py, agqo/quantum/design.py."
  - id: A2
    kind: table
    headline: "A2 · Bốn đại lượng khác nhau, đừng trộn lẫn"
    rows:
      - ["Đại lượng", "Đo cái gì", "Giá trị trong nghiên cứu"]
      - ["Xác suất gần tối ưu mỗi lần đo", "Chất lượng mẫu: P(đủ tiền, thỏa quy tắc, khoảng cách chuẩn hoá ≤ 5%)", "AGQO 21,3% · warm start 3,1% · sách giáo khoa 1,1%"]
      - ["Số lần đo (shots)", "Bao nhiêu mẫu lấy từ một mạch đã chạy", "512 mỗi quyết định; với 21% mỗi lần, gần như chắc chắn có ít nhất một mẫu gần tối ưu"]
      - ["Số lần mô phỏng mạch", "Chi phí của bộ tối ưu góc", "Lịch cố định: 1 · tinh chỉnh COBYLA: 41 · QAOA sách giáo khoa: 101"]
      - ["Cổng hai qubit", "Độ sâu / chi phí phần cứng", "AGQO 1.440 cổng logic (p = 6); mạch chọn cho nhiễu: 4–20 logic, 2–34 sau biên dịch"]
      - ["Khoảng cách chuẩn hoá", "(mục tiêu − tối ưu) / (trung vị khả thi − tối ưu)", "0 = tối ưu chính xác trong không gian đã mã hoá; 1 = lựa chọn khả thi điển hình"]
    caption: "Nguồn: results/final/quantum_test.csv, quantum_stats.json, extras/hardware_aware.csv."
  - id: A3
    kind: chart
    headline: "A3 · Có nhiễu: mạch nông chọn theo nhiễu vẫn hơn warm start 1,57× (ước tính ESP)"
    data: a_noise.csv
    x: date
    type: column
    series: [["esp_model_success", "Noise-aware AGQO circuit (ESP estimate)"], ["warm_esp_model", "Warm-start baseline (ESP estimate)"]]
    fmt: '0%'
    labels: false
    side:
      - "Tỷ số trung bình 1,57× (tỷ số các trung bình), hơn ở 11/12 quý."
      - "ESP là mô hình ước tính từ số cổng và tỷ lệ lỗi; không phải chạy phần cứng."
      - "Mô phỏng nhiễu Aer chạy cho 3 quý: 4,2% · 0,7% · 18,5%."
      - "Ở 3 quý đó, số cổng hai qubit sau biên dịch là 2–34, trung bình 16."
      - "Mạch sâu đầy đủ (1.440 cổng logic, ~4.355 cổng thực) gần như mất hết tín hiệu dưới nhiễu hiện nay."
    caption: "IBM Heron (FakeKingston), lịch chọn trên dữ liệu 2023. Nguồn: results/final/extras/hardware_aware.csv, hardware.csv."
  - id: A4
    kind: chart
    headline: "A4 · Khi tăng số qubit: tỷ số tăng nhưng xác suất tuyệt đối giảm"
    data: a_scaling.csv
    x: qubits
    type: line
    series: [["frozen_success", "Frozen schedule (from 2023)"], ["warm_success", "Warm-start baseline"]]
    fmt: '0%'
    label_fmt: '0.0%'
    x_title: "Qubits"
    side:
      - "Lịch cố định: 30,0% ở 8 qubit → 12,9% ở 20 qubit."
      - "Tỷ số so với warm start: 4,3× → 16,7×."
      - "Liệt kê cổ điển: 0,001 giây ở 8 qubit, 0,12 giây ở 16, 2,4 giây ở 20."
      - "Ở quy mô này, bộ giải cổ điển là lựa chọn triển khai hợp lý; QAOA là hướng nghiên cứu khi bài toán lớn hơn."
    caption: "Mô phỏng không nhiễu. Nguồn: results/final/extras/scaling.csv."
