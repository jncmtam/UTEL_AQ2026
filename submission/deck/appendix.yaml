    headline: "A10 · Tái lập và khai báo sử dụng AI"
    size: 15
    lines:
      - "Mỗi lần chạy V3.2 có thư mục results/runs/<run_id>/ với run.json: commit, mã băm dữ liệu, cấu hình, các bước, lỗi; bằng chứng V3 giữ nguyên trong results/final/."
      - "Mô phỏng mạch và kiểm thử chạy trên Modal CPU qua notebook notebooks/AGQO_V3_2_Research_Modal.ipynb; LLM chạy trên Modal H100; có chế độ phát lại không cần GPU."
      - "Kiểm thử: 58/58 trên Modal CPU tại thời điểm đóng gói."
      - "Công cụ AI hỗ trợ: Qwen3.8-27B là một thành phần của sản phẩm (đọc yêu cầu, viết giải thích); nhóm dùng trợ lý lập trình AI (Claude) để viết mã, chạy thí nghiệm và soạn tài liệu; mọi con số lấy từ tệp kết quả và được nhóm kiểm tra."
      - "Không có ưu thế lượng tử được khẳng định: ở 16 qubit, liệt kê cổ điển giải chính xác và được dùng để kiểm chứng."
