# Q&A cards (Vietnamese). answer: what to say (2–4 sentences). evidence: slide/appendix or file to open.
cards:
  - q: "Ở 16 qubit máy tính cổ điển liệt kê hết rồi, vậy nghiên cứu QAOA để làm gì?"
    a: "Đúng, ở 16 qubit liệt kê toàn bộ 65.536 tổ hợp mất khoảng 0,12 giây, và chúng em dùng chính phép liệt kê đó làm đáp án để chấm mạch. Kích thước này là chỗ duy nhất đo được chính xác mạch tốt hay dở. Khi tăng lên 20 qubit, liệt kê mất 2,4 giây và tăng gấp đôi sau mỗi qubit; xác suất mạch lấy đúng giảm từ 30,0% xuống 12,9%. Vì vậy với sản phẩm hôm nay, chúng em đề xuất bộ giải cổ điển."
    evidence: "Slide 6, phụ lục A4; results/final/extras/scaling.csv"
  - q: "Vì sao người dùng chọn lô chẵn thay vì ETF hay lô lẻ?"
    a: "Nếu không có quy tắc riêng, ETF tiện hơn và lô lẻ bám tốt hơn trong mô phỏng của chúng em (2,53%). Lô chẵn có ý nghĩa khi người dùng muốn bỏ một ngành hay giới hạn ngân hàng, điều ETF không làm được, và muốn đặt lệnh trên sổ lệnh chính. Lô lẻ có sổ lệnh riêng, thanh khoản mỏng hơn; mô phỏng của chúng em chưa tính trượt giá đó."
    evidence: "Slide 2, phụ lục A8"
  - q: "k-NN thêm được gì khi kiểm định?"
    a: "Trên 330 bài toán holdout mới, k-NN hơn lịch cố định 0,76 điểm % xác suất mỗi lần đo, thắng 20/22 tháng. Nhưng chỉ cần chọn một lịch riêng cho mỗi cỡ tài khoản cũng được đúng mức đó. Con số 21,3% < 23,8% của V3 đến từ bước tinh chỉnh COBYLA, không phải từ k-NN: bỏ tinh chỉnh thì k-NN đạt 24,0%."
    evidence: "Phụ lục A6; docs/RESULTS_V3_2.md §2"
  - q: "Nếu AI hiểu sai yêu cầu thì ai phát hiện?"
    a: "Có ba lớp. Một, ràng buộc AI hiểu được hiện thành các ô có nhãn nguồn; người dùng phải bấm xác nhận thì mới có lệnh, câu mơ hồ hay mâu thuẫn thì phải trả lời trước. Hai, bộ tối ưu và phép kiểm tra quy tắc là mã cố định, tính trên giá trị tài khoản sau phí. Ba, lời giải thích của AI bị đối chiếu từng con số với dữ liệu; câu nào sai, kể cả câu nói thị trường cấm lô lẻ, bị thay bằng giải thích tạo tự động."
    evidence: "Slide 3; phụ lục A5; tests/test_v32_review.py"
  - q: "Thuật toán tham lam ngang AGQO, vậy AGQO đóng góp gì?"
    a: "Chúng em đưa thuật toán tham lam vào chính vì nó mạnh. Ở 20 triệu, chênh lệch với AGQO là −0,69 điểm % với khoảng tin cậy từ −1,53 đến +0,02, chưa có ý nghĩa thống kê; khi có hai quy tắc thì gần như bằng nhau. Phần tạo giá trị là tối ưu cả tổ hợp lô thay vì làm tròn từng mã; AGQO cho nghiệm tối ưu chính xác trong không gian đã mã hoá và kiểm chứng được."
    evidence: "Slide 4; phụ lục A7"
  - q: "Có phải ưu thế lượng tử không?"
    a: "Không. Mọi kết quả lượng tử là mô phỏng; mô hình nhiễu ESP và mô phỏng Aer cho thấy mạch nông vẫn có tín hiệu, nhưng chúng em chưa chạy phần cứng thật và không khẳng định ưu thế."
    evidence: "Phụ lục A3, A10"
  - q: "Vì sao danh mục AGQO ở slide 3 để lại 5 triệu tiền mặt?"
    a: "Với 20 triệu và hai quy tắc, nhiều lô quá lớn: một lô MSN đã là 35% tài khoản. Mua thêm một lô bất kỳ còn lại sẽ làm danh mục lệch VN30 nhiều hơn là giữ tiền. Con số tiền mặt sau phí hiện ngay cạnh lệnh để người dùng thấy đánh đổi đó."
    evidence: "Slide 3; ảnh màn hình docs/prototype_shots/v32/pitch_result.png"
  - q: "Giá lịch sử đã điều chỉnh có làm sai kết quả tài khoản nhỏ không?"
    a: "Có thể, vì giá lô quá khứ bị tính rẻ hơn giá khớp thật. Chúng em chưa có giá khớp gốc nên đo giới hạn: nếu giá lô cao hơn tới 50%, AGQO vẫn thấp hơn làm tròn khoảng 4,9 điểm %. Chênh lệch riêng từng mã thì chưa đo được."
    evidence: "Phụ lục A7"
  - q: "Demo dùng LLM trực tiếp hay phát lại?"
    a: "Trang ghi rõ từng trường hợp. Trong buổi thi chúng em dùng câu trả lời Qwen đã lưu cho câu mẫu, vì GPU khởi động lạnh mất 440 giây; phần tối ưu vẫn chạy trực tiếp trên Modal, khoảng 5–11 giây. Nếu GPU đã ấm, Qwen trả lời trong khoảng 4 giây."
    evidence: "Phụ lục A9"
  - q: "Quy tắc 30% tính trên cơ sở nào?"
    a: "Trên giá trị tài khoản sau phí: tiền mặt còn lại sau khi trả phí cộng giá trị cổ phiếu vừa mua. Bản trước tính trên vốn ban đầu nên từng báo đạt ở 25,03%; bản này siết trần theo biên phí và kiểm tra lại sau phí."
    evidence: "Slide 3; tests/test_v32_product.py"
